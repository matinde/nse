services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nse
      POSTGRES_PASSWORD: nse
      POSTGRES_DB: nse
    volumes:
      - nse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nse -d nse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: platform/Dockerfile
    env_file:
      - .env
    environment: &platform-env
      PORT: "9011"
      POSTGRES_USER: nse
      POSTGRES_PASSWORD: nse
      POSTGRES_DB: nse
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DATA_DIR: /app/data
      CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_WEB_9011:-http://localhost:9011}
    volumes:
      - ./data:/app/data
    ports:
      - "9011:9011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: platform/Dockerfile
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment: *platform-env
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: platform/Dockerfile
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment: *platform-env
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  nse-app:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_USER: nse
      POSTGRES_PASSWORD: nse
      POSTGRES_DB: nse
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
    ports:
      - "9010:9010"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  nse_pg:
