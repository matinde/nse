{% extends "market/base.html" %}
{% block title %}Log in · NSE{% endblock %}
{% block body %}
<main class="flex min-h-screen items-center justify-center px-4">
  <form method="post" class="rise w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    {% csrf_token %}
    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-teal-700 dark:text-teal-300">Nairobi Securities Exchange</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">Investment Explorer</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">An administrator creates your account. There is no registration on this site.</p>
    {% if error %}
      <p class="mt-4 rounded-2xl bg-rose-50 px-4 py-3 text-sm text-rose-700 dark:bg-rose-950/40 dark:text-rose-200">{{ error }}</p>
    {% endif %}
    <label class="mt-6 block text-sm font-medium" for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required class="mt-1 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none ring-teal-600 focus:ring-2 dark:border-slate-700 dark:bg-slate-950">
    <label class="mt-4 block text-sm font-medium" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none ring-teal-600 focus:ring-2 dark:border-slate-700 dark:bg-slate-950">
    <button class="mt-6 w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-700 dark:bg-teal-500 dark:text-slate-950 dark:hover:bg-teal-400">Log in</button>
  </form>
</main>
{% endblock %}
